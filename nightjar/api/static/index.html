<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nightjar — mini-SIEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Nightjar dashboard — skinned with the TemplateMo "Lustro"
   design language (glassmorphism, ambient gradients, Space
   Grotesk / DM Sans / JetBrains Mono). https://templatemo.com
   ============================================================ */
:root{
  --ee:cubic-bezier(0.19,1,0.22,1);
  --eq:cubic-bezier(0.77,0,0.175,1);
  --bg:#0a0e1a; --bg-2:#0d1220;
  --ink:#ffffff;
  --ink-2:rgba(255,255,255,.7);
  --ink-3:rgba(255,255,255,.5);
  --ink-4:rgba(255,255,255,.3);
  --line:rgba(255,255,255,.1);
  --line-2:rgba(255,255,255,.06);
  --glass-bg:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  --glass-border:rgba(255,255,255,.1);
  --glass-blur:blur(40px);
  --indigo:#6366f1; --indigo-soft:#a5b4fc;
  --pink:#ec4899; --pink-soft:#f9a8d4;
  --cyan:#22d3ee; --green:#4ade80; --amber:#fbbf24; --red:#ef4444;
  --grad-a:linear-gradient(135deg,#fff 0%,#a5b4fc 50%,#ec4899 100%);
  --grad-b:linear-gradient(135deg,#6366f1,#ec4899);
  --font-sans:'Space Grotesk',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  /* severity palette */
  --sev-critical:var(--pink);
  --sev-high:var(--red);
  --sev-medium:var(--amber);
  --sev-low:var(--cyan);
  --sev-info:var(--ink-3);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  min-height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);-webkit-font-smoothing:antialiased;
  position:relative;overflow-x:hidden;
}
/* Ambient background (from Lustro .deck::before / ::after) */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 15% 12%,rgba(99,102,241,.22) 0%,transparent 50%),
    radial-gradient(circle at 85% 85%,rgba(236,72,153,.15) 0%,transparent 50%),
    radial-gradient(circle at 50% 50%,rgba(34,211,238,.07) 0%,transparent 60%);
  animation:ambient 14s ease-in-out infinite alternate}
@keyframes ambient{to{opacity:.7;transform:scale(1.05)}}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse at center,black 20%,transparent 82%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 20%,transparent 82%)}
.app{position:relative;z-index:1}

/* custom scrollbars */
*{scrollbar-width:thin;scrollbar-color:rgba(165,180,252,.3) transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(165,180,252,.35),rgba(236,72,153,.3));border-radius:100px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,rgba(165,180,252,.6),rgba(236,72,153,.5));background-clip:padding-box;border:2px solid transparent}

/* ============ header ============ */
header{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;
  padding:18px 28px;
  background:linear-gradient(180deg,rgba(10,14,26,.85),rgba(10,14,26,.45));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line-2);
}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--font-sans);font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--grad-b);position:relative;flex-shrink:0;box-shadow:0 6px 18px rgba(99,102,241,.35)}
.brand .logo::after{content:'🛡️';position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.brand .sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin-left:4px}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pip 2s infinite}
@keyframes pip{0%,100%{opacity:1}50%{opacity:.3}}
.btn{font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;border-radius:100px;
  padding:10px 20px;display:inline-flex;align-items:center;gap:9px;transition:all .3s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:#fff;color:var(--bg)}
.btn-primary:hover{background:linear-gradient(135deg,var(--indigo-soft),#fff);transform:translateY(-2px);box-shadow:0 10px 30px rgba(165,180,252,.25)}
.btn-primary:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none;background:#fff}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--ink-2);border-color:var(--glass-border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.btn-ghost:hover{background:rgba(255,255,255,.12);color:var(--ink)}
.caret{font-size:10px;opacity:.7}

/* attack menu */
.replay{position:relative}
.replay-menu{position:absolute;top:calc(100% + 10px);right:0;width:290px;z-index:60;
  background:linear-gradient(180deg,rgba(20,24,42,.97),rgba(13,18,32,.97));
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:8px;
  display:flex;flex-direction:column;gap:2px;
  box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 50px rgba(99,102,241,.15);
  opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);
  transition:opacity .25s var(--ee),visibility .25s,transform .3s var(--ee)}
.replay-menu.open{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.rm-item{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:12px 13px;border-radius:12px;border:1px solid transparent;background:transparent;
  cursor:pointer;color:var(--ink);transition:all .2s var(--ee);font-family:inherit}
.rm-item:hover{background:rgba(255,255,255,.05);border-color:var(--line)}
.rm-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:rgba(99,102,241,.15);flex-shrink:0}
.rm-item:nth-child(2) .rm-ic{background:rgba(236,72,153,.15)}
.rm-item:nth-child(3) .rm-ic{background:rgba(74,222,128,.15)}
.rm-body{display:flex;flex-direction:column;gap:2px}
.rm-t{font-family:var(--font-sans);font-weight:500;font-size:14px;letter-spacing:-.01em}
.rm-s{font-family:var(--font-body);font-size:11.5px;color:var(--ink-3)}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;z-index:80;
  transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,rgba(20,24,42,.97),rgba(13,18,32,.97));
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border:1px solid rgba(99,102,241,.4);border-radius:100px;padding:12px 22px;
  font-family:var(--font-body);font-size:13px;color:var(--ink);white-space:nowrap;
  box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 40px rgba(99,102,241,.2);
  display:flex;align-items:center;gap:10px;opacity:0;visibility:hidden;
  transition:opacity .35s var(--ee),transform .35s var(--ee),visibility .35s}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);flex-shrink:0}

/* ============ layout ============ */
.wrap{max-width:1440px;margin:0 auto;padding:26px 28px 60px;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(4,1fr)}
.cols{grid-template-columns:1.7fr 1fr;align-items:start}
@media(max-width:1024px){.kpis{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
@media(max-width:560px){.kpis{grid-template-columns:1fr}header{padding:14px 16px;flex-wrap:wrap}.wrap{padding:18px 14px 48px}.hide-sm{display:none}}

/* glass card */
.card{background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);border-radius:22px;padding:22px;position:relative;overflow:hidden}
.card>h2{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.2em;
  color:var(--ink-3);margin:0 0 16px;display:flex;align-items:center;gap:9px}
.card>h2::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--indigo-soft);box-shadow:0 0 8px var(--indigo)}

/* KPI metric card */
.kpi{min-height:132px;display:flex;flex-direction:column;justify-content:space-between}
.kpi::before{content:'';position:absolute;top:-30%;right:-30%;width:150px;height:150px;
  background:radial-gradient(circle,rgba(99,102,241,.25),transparent 70%);filter:blur(30px);opacity:0;transition:opacity .8s}
.kpi:hover::before{opacity:1}
.kpi .n{font-family:var(--font-sans);font-weight:600;font-size:clamp(34px,4vw,52px);letter-spacing:-.04em;line-height:1;
  color:#fff;
  text-shadow:0 0 6px rgba(255,255,255,.85),0 0 18px rgba(165,180,252,.65),0 0 38px rgba(99,102,241,.45)}
.kpi .l{font-family:var(--font-body);font-size:12.5px;color:var(--ink-2);margin-top:12px}
.kpi.k2 .n{text-shadow:0 0 6px rgba(255,255,255,.85),0 0 18px rgba(34,211,238,.65),0 0 38px rgba(34,211,238,.4)}
.kpi.k3 .n{text-shadow:0 0 6px rgba(255,255,255,.85),0 0 18px rgba(74,222,128,.6),0 0 38px rgba(74,222,128,.4)}
.kpi.k4 .n{text-shadow:0 0 6px rgba(255,255,255,.85),0 0 18px rgba(249,168,212,.65),0 0 38px rgba(236,72,153,.4)}

/* timeline */
#timeline svg{width:100%;height:92px;display:block}
#timeline rect{fill:url(#tlGrad)}

/* severity bars */
.sevbars{display:flex;flex-direction:column;gap:11px}
.sevrow{display:grid;grid-template-columns:74px 1fr 30px;align-items:center;gap:10px}
.sevrow .track{height:8px;border-radius:100px;background:rgba(255,255,255,.05);overflow:hidden}
.sevrow .track>i{display:block;height:100%;border-radius:100px}
.sevrow .val{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:100px;font-family:var(--font-mono);
  font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.sev-critical{color:var(--sev-critical);background:rgba(236,72,153,.14)}
.sev-high{color:var(--sev-high);background:rgba(239,68,68,.14)}
.sev-medium{color:var(--sev-medium);background:rgba(251,191,36,.14)}
.sev-low{color:var(--sev-low);background:rgba(34,211,238,.14)}
.sev-info{color:var(--sev-info);background:rgba(255,255,255,.06)}

/* tables */
table{width:100%;border-collapse:separate;border-spacing:0}
td{padding:9px 6px;border-bottom:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.ip{font-family:var(--font-mono);font-size:12.5px;color:var(--ink);letter-spacing:-.01em}
.num{font-family:var(--font-mono);font-size:12.5px;text-align:right;color:var(--ink)}

/* alert feed */
.feed{display:flex;flex-direction:column;gap:11px;max-height:660px;overflow:auto;padding-right:4px}
.alert{border:1px solid var(--line);border-left-width:3px;border-radius:16px;padding:14px 16px;
  background:rgba(255,255,255,.03);transition:all .3s var(--ee)}
.alert:hover{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.18);transform:translateX(3px)}
.alert.critical{border-left-color:var(--sev-critical)}
.alert.high{border-left-color:var(--sev-high)}
.alert.medium{border-left-color:var(--sev-medium)}
.alert.low{border-left-color:var(--sev-low)}
.alert.info{border-left-color:var(--sev-info)}
.alert .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.alert .title{font-family:var(--font-sans);font-weight:500;font-size:15px;letter-spacing:-.01em}
.alert .mitre{font-family:var(--font-mono);font-size:10.5px;color:var(--indigo-soft);letter-spacing:.06em;
  background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.28);padding:2px 8px;border-radius:100px}
.alert .meta{font-family:var(--font-body);font-size:12px;color:var(--ink-3);margin-top:7px}
.alert .meta .ip{color:var(--ink-2)}
.alert .evid{font-family:var(--font-mono);font-size:11px;color:var(--ink-4);margin-top:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.2);padding:7px 10px;border-radius:9px}
.empty{color:var(--ink-3);padding:26px;text-align:center;font-size:13px}

/* entrance */
.card{opacity:0;transform:translateY(18px);animation:cardIn .8s var(--ee) forwards}
.wrap .card:nth-child(1){animation-delay:.05s}
.grid.kpis .card:nth-child(2){animation-delay:.1s}
.grid.kpis .card:nth-child(3){animation-delay:.15s}
.grid.kpis .card:nth-child(4){animation-delay:.2s}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}

/* templatemo credit */
.tm-credit{position:fixed;bottom:18px;right:22px;z-index:40;font-family:var(--font-mono);font-size:9.5px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--ink-4);text-decoration:none;display:flex;gap:8px;align-items:center;transition:color .25s}
.tm-credit:hover{color:var(--ink-2)}
.tm-credit .tm-dot{width:5px;height:5px;border-radius:50%;background:var(--pink-soft);box-shadow:0 0 10px var(--pink);animation:pip 2s infinite}
@media(max-width:560px){.tm-credit{display:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><span class="logo"></span> Nightjar <span class="sub hide-sm">Detection-as-Code SIEM</span></div>
  <span class="spacer"></span>
  <span class="live hide-sm"><span class="dot" id="live"></span> live · <span id="updated">—</span></span>
  <button class="btn btn-ghost" id="pauseBtn">Pause</button>
  <div class="replay" id="replay">
    <button class="btn btn-primary" id="replayBtn">▶ Launch attack <span class="caret">▾</span></button>
    <div class="replay-menu" id="replayMenu" role="menu">
      <button class="rm-item" role="menuitem" data-scenario="ssh" data-label="SSH brute force">
        <span class="rm-ic">🔑</span>
        <span class="rm-body"><span class="rm-t">SSH brute force</span><span class="rm-s">Failed logins + user enum · T1110</span></span>
      </button>
      <button class="rm-item" role="menuitem" data-scenario="web" data-label="Web attack">
        <span class="rm-ic">🌐</span>
        <span class="rm-body"><span class="rm-t">Web attack</span><span class="rm-s">SQLi, traversal, scanning · T1190</span></span>
      </button>
      <button class="rm-item" role="menuitem" data-scenario="full" data-label="Full assault">
        <span class="rm-ic">💥</span>
        <span class="rm-body"><span class="rm-t">Full assault</span><span class="rm-s">Every scenario at once</span></span>
      </button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="grid kpis">
    <div class="card kpi k1"><div class="n" id="k-alerts">—</div><div class="l">Total alerts</div></div>
    <div class="card kpi k2"><div class="n" id="k-events">—</div><div class="l">Events parsed</div></div>
    <div class="card kpi k3"><div class="n" id="k-rules">—</div><div class="l">Rules loaded</div></div>
    <div class="card kpi k4"><div class="n" id="k-offenders">—</div><div class="l">Offending IPs</div></div>
  </div>

  <div class="card">
    <h2>Alert timeline</h2>
    <div id="timeline"></div>
  </div>

  <div class="grid cols">
    <div class="card">
      <h2>Live alert feed</h2>
      <div class="feed" id="feed"></div>
    </div>
    <div class="grid" style="gap:18px">
      <div class="card">
        <h2>Alerts by severity</h2>
        <div class="sevbars" id="sev"></div>
      </div>
      <div class="card">
        <h2>Top offending IPs</h2>
        <table><tbody id="offenders"></tbody></table>
      </div>
      <div class="card">
        <h2>Rule hit counts</h2>
        <table><tbody id="rulehits"></tbody></table>
      </div>
    </div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<a class="tm-credit" href="https://templatemo.com" target="_blank" rel="nofollow noopener" aria-label="Design by TemplateMo">
  <span class="tm-dot"></span><span>Design: TemplateMo</span>
</a>

<script>
const SEV = ["critical","high","medium","low","info"];
const $ = (id) => document.getElementById(id);
let paused = false;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sevRank(r){ return SEV[SEV.length-1-r] || "info"; }

async function refresh(){
  if (paused) return;
  try {
    const [sumRes, alRes] = await Promise.all([
      fetch("/api/summary"), fetch("/api/alerts?limit=60")
    ]);
    if (!sumRes.ok || !alRes.ok) return;
    render(await sumRes.json(), await alRes.json());
    $("updated").textContent = new Date().toLocaleTimeString();
  } catch(e){ /* keep last view */ }
}

function render(s, alerts){
  $("k-alerts").textContent = s.total_alerts;
  $("k-events").textContent = s.total_events;
  $("k-rules").textContent = s.rules_loaded;
  $("k-offenders").textContent = s.top_offenders.length;

  const total = Object.values(s.by_severity).reduce((a,b)=>a+b,0) || 1;
  $("sev").innerHTML = SEV.filter(k => s.by_severity[k]).map(k => {
    const v = s.by_severity[k], pct = Math.round(v/total*100);
    return `<div class="sevrow"><span class="pill sev-${k}">${k}</span>
      <div class="track"><i style="width:${Math.max(pct,4)}%;background:var(--sev-${k})"></i></div>
      <span class="val">${v}</span></div>`;
  }).join("") || `<div class="empty">no alerts</div>`;

  $("offenders").innerHTML = s.top_offenders.map(o =>
    `<tr><td class="ip">${esc(o.ip)}</td>
      <td><span class="pill sev-${sevRank(o.max_severity_rank)}">${sevRank(o.max_severity_rank)}</span></td>
      <td class="num">${o.alerts}</td></tr>`).join("")
    || `<tr><td class="empty">—</td></tr>`;

  $("rulehits").innerHTML = s.rule_hits.map(r =>
    `<tr><td>${esc(r.title)}</td><td class="num">${r.hits}</td></tr>`).join("")
    || `<tr><td class="empty">—</td></tr>`;

  $("feed").innerHTML = alerts.map(a => {
    const when = new Date(a.timestamp).toLocaleString();
    const mitre = (a.mitre||[]).length ? `<span class="mitre">${esc(a.mitre.join(" · "))}</span>` : "";
    const evid = a.events && a.events[0] ? esc(a.events[0].raw) : "";
    return `<div class="alert ${a.severity}">
      <div class="top"><span class="pill sev-${a.severity}">${a.severity}</span>
        <span class="title">${esc(a.title)}</span> ${mitre}</div>
      <div class="meta">${when} · src <span class="ip">${esc(a.src_ip||"—")}</span> · ${a.count} event(s)</div>
      ${evid ? `<div class="evid">${evid}</div>` : ""}
    </div>`;
  }).join("") || `<div class="empty">No alerts yet. Hit “Replay attack”.</div>`;

  drawTimeline(s.timeline);
}

function drawTimeline(tl){
  const w = 100, h = 60, n = tl.length;
  if (!n){ $("timeline").innerHTML = `<div class="empty">no data</div>`; return; }
  const max = Math.max(1, ...tl.map(d => d.count)), bw = w / n;
  const bars = tl.map((d,i) => {
    const bh = (d.count/max) * (h-6);
    return `<rect x="${(i*bw).toFixed(2)}" y="${(h-bh).toFixed(2)}" width="${(bw*0.72).toFixed(2)}"
      height="${bh.toFixed(2)}" rx="0.6"><title>${d.count} alerts</title></rect>`;
  }).join("");
  $("timeline").innerHTML =
    `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
       <defs><linearGradient id="tlGrad" x1="0" y1="0" x2="0" y2="1">
         <stop offset="0%" stop-color="#a5b4fc"/><stop offset="100%" stop-color="#6366f1" stop-opacity=".55"/>
       </linearGradient></defs>${bars}</svg>`;
}

// --- attack menu + toast ---
const replayBtn = $("replayBtn"), replayMenu = $("replayMenu"), replayWrap = $("replay");
const closeReplay = () => replayMenu.classList.remove("open");
replayBtn.addEventListener("click", (e) => { e.stopPropagation(); replayMenu.classList.toggle("open"); });
document.addEventListener("click", (e) => { if (!replayWrap.contains(e.target)) closeReplay(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeReplay(); });

let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 4200);
}

replayMenu.querySelectorAll(".rm-item").forEach(item => {
  item.addEventListener("click", async () => {
    const { scenario, label } = item.dataset;
    closeReplay();
    const old = replayBtn.innerHTML;
    replayBtn.disabled = true; replayBtn.textContent = "Launching…";
    try {
      const r = await fetch("/api/replay?scenario=" + scenario, { method: "POST" });
      const j = await r.json();
      await refresh();
      toast(`Launched ${label} — ${j.alerts} alert(s) detected`);
    } catch (e) {
      toast("Launch failed — is the server running?");
    } finally {
      replayBtn.disabled = false; replayBtn.innerHTML = old;
    }
  });
});
$("pauseBtn").addEventListener("click", () => {
  paused = !paused;
  $("pauseBtn").textContent = paused ? "Resume" : "Pause";
  $("live").style.background = paused ? "var(--ink-4)" : "var(--green)";
  $("live").style.boxShadow = paused ? "none" : "0 0 10px var(--green)";
});

refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
