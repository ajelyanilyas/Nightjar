[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightjar"
version = "0.1.0"
description = "Detection-as-Code mini-SIEM: YAML rules, MITRE ATT&CK alerts, live dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
nightjar = "nightjar.cli:main"

[tool.setuptools.packages.find]
include = ["nightjar*"]
